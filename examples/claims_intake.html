<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auto Claim Intake</title>
</head>
<body>
<h1>Auto Claim Intake</h1>

<form id="claim-intake" method="post" action="/claims">

  <!-- ================= Screen 1 ================= -->
  <section class="screen" id="claimant" data-screen="claimant">
    <h2>Claimant Details</h2>

    <fieldset>
      <legend>Name</legend>
      <label for="prefix">Title</label>
      <select id="prefix" name="prefix">
        <option value="">-- Select --</option>
        <option value="Mr.">Mr.</option>
        <option value="Ms.">Ms.</option>
        <option value="Mrs.">Mrs.</option>
        <option value="Dr.">Dr.</option>
        <option value="Mx.">Mx.</option>
      </select>

      <label for="fname">First Name</label>
      <input type="text" id="fname" name="first_name" autocomplete="given-name"
             maxlength="40" required>

      <label for="mi">Middle Initial</label>
      <input type="text" id="mi" name="middle_initial" maxlength="1">

      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="last_name" autocomplete="family-name"
             maxlength="40" required>

      <label for="suffix">Suffix</label>
      <input type="text" id="suffix" name="suffix" maxlength="6">
    </fieldset>

    <fieldset>
      <legend>Identity</legend>
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="date_of_birth" required
             min="1920-01-01" max="2008-12-31">

      <label for="ssn">Social Security Number</label>
      <input type="text" id="ssn" name="ssn" placeholder="XXX-XX-XXXX"
             pattern="\d{3}-\d{2}-\d{4}" required
             aria-describedby="ssn-help">
      <small id="ssn-help">We use this only to verify your policy.</small>

      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">-- Select --</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Non-binary">Non-binary</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Contact</legend>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" autocomplete="email"
             maxlength="80" required>

      <label for="phone">Primary Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="(555) 555-0100" required>

      <label for="mobile">Mobile Phone</label>
      <input type="tel" id="mobile" name="mobile_phone">

      <span>Preferred contact method</span>
      <label for="pref-email">Email</label>
      <input type="radio" id="pref-email" name="preferred_contact" value="email" required>
      <label for="pref-phone">Phone</label>
      <input type="radio" id="pref-phone" name="preferred_contact" value="phone">
      <label for="pref-mail">Mail</label>
      <input type="radio" id="pref-mail" name="preferred_contact" value="mail">
    </fieldset>
  </section>

  <!-- ================= Screen 2 ================= -->
  <section class="screen" id="addresses" data-screen="addresses">
    <h2>Addresses</h2>

    <fieldset data-group="home">
      <legend>Home Address</legend>
      <label for="home-street">Street Address</label>
      <input type="text" id="home-street" name="home_street"
             autocomplete="address-line1" maxlength="60" required>

      <label for="home-apt">Apt / Suite</label>
      <input type="text" id="home-apt" name="home_address_line2"
             autocomplete="address-line2" maxlength="20">

      <label for="home-city">City</label>
      <input type="text" id="home-city" name="home_city"
             autocomplete="address-level2" maxlength="40" required>

      <label for="home-state">State</label>
      <select id="home-state" name="home_state" autocomplete="address-level1" required>
        <option value="">-- Select --</option>
        <option value="AZ">Arizona</option>
        <option value="CA">California</option>
        <option value="CO">Colorado</option>
        <option value="FL">Florida</option>
        <option value="IL">Illinois</option>
        <option value="NY">New York</option>
        <option value="TX">Texas</option>
        <option value="WA">Washington</option>
      </select>

      <label for="home-zip">ZIP Code</label>
      <input type="text" id="home-zip" name="home_postal_code"
             autocomplete="postal-code" maxlength="10" pattern="\d{5}(-\d{4})?" required>
    </fieldset>

    <fieldset data-group="mailing">
      <legend>Mailing Address (if different)</legend>
      <label for="mail-street">Street Address</label>
      <input type="text" id="mail-street" name="mailing_street" maxlength="60">

      <label for="mail-city">City</label>
      <input type="text" id="mail-city" name="mailing_city" maxlength="40">

      <label for="mail-state">State</label>
      <input type="text" id="mail-state" name="mailing_state" maxlength="2">

      <label for="mail-zip">ZIP Code</label>
      <input type="text" id="mail-zip" name="mailing_postal_code" maxlength="5">

      <label for="mail-country">Country</label>
      <select id="mail-country" name="mailing_country">
        <option value="US">United States</option>
        <option value="CA">Canada</option>
        <option value="MX">Mexico</option>
      </select>
    </fieldset>
  </section>

  <!-- ================= Screen 3 ================= -->
  <section class="screen" id="policy" data-screen="policy">
    <h2>Policy &amp; Employment</h2>

    <label for="policy-no">Policy Number</label>
    <input type="text" id="policy-no" name="policy_number" maxlength="20" required>

    <label for="group-no">Group Number</label>
    <input type="text" id="group-no" name="group_number" maxlength="12">

    <label for="member-id">Member ID</label>
    <input type="text" id="member-id" name="member_id" maxlength="16" required>

    <label for="effective">Policy Effective Date</label>
    <input type="date" id="effective" name="effective_date" required>

    <label for="renewal">Renewal Date</label>
    <input type="date" id="renewal" name="renewal_date">

    <label for="deductible">Deductible</label>
    <input type="number" id="deductible" name="deductible_amount"
           min="0" max="5000" step="50" required>

    <label for="coverage">Coverage Limit</label>
    <input type="number" id="coverage" name="coverage_limit"
           min="10000" max="1000000" step="10000">

    <fieldset data-group="employer">
      <legend>Employer</legend>
      <label for="employer">Company Name</label>
      <input type="text" id="employer" name="employer_company"
             autocomplete="organization" maxlength="60">

      <label for="job">Occupation</label>
      <input type="text" id="job" name="employer_job_title" maxlength="50">

      <label for="emp-city">City</label>
      <input type="text" id="emp-city" name="employer_city" maxlength="40">

      <label for="emp-state">State</label>
      <input type="text" id="emp-state" name="employer_state" maxlength="2">

      <label for="emp-phone">Work Phone</label>
      <input type="tel" id="emp-phone" name="employer_phone">
    </fieldset>
  </section>

  <!-- ================= Screen 4 ================= -->
  <section class="screen" id="incident" data-screen="incident">
    <h2>Incident</h2>

    <label for="claim-no">Claim Number</label>
    <input type="text" id="claim-no" name="claim_number" maxlength="16" readonly>

    <label for="incident-date">Date of Incident</label>
    <input type="date" id="incident-date" name="incident_date" required>

    <label for="incident-time">Time of Incident</label>
    <input type="time" id="incident-time" name="incident_time">

    <label for="loss-amount">Estimated Loss Amount</label>
    <input type="number" id="loss-amount" name="loss_amount"
           min="100" max="250000" step="0.01" required>

    <fieldset>
      <legend>Was anyone injured?</legend>
      <label for="injury-yes">Yes</label>
      <input type="radio" id="injury-yes" name="injury_reported" value="Yes" required>
      <label for="injury-no">No</label>
      <input type="radio" id="injury-no" name="injury_reported" value="No">
    </fieldset>

    <label for="diagnosis">Diagnosis Code</label>
    <input type="text" id="diagnosis" name="diagnosis_code" maxlength="10"
           placeholder="ICD-10">

    <label for="police">Police report filed</label>
    <input type="checkbox" id="police" name="police_report_filed" value="yes">

    <label for="description">Describe what happened</label>
    <textarea id="description" name="incident_description"
              rows="5" minlength="20" maxlength="500" required></textarea>

    <fieldset data-group="payee">
      <legend>Payment</legend>
      <label for="payee-name">Payee Name</label>
      <input type="text" id="payee-name" name="payee_full_name" maxlength="80" required>

      <label for="routing">Routing Number</label>
      <input type="text" id="routing" name="payee_routing_number"
             maxlength="9" pattern="\d{9}" required>

      <label for="account">Account Number</label>
      <input type="text" id="account" name="payee_account_number" maxlength="17" required>
    </fieldset>

    <button type="submit">Submit Claim</button>
    <button type="reset">Clear</button>
  </section>

</form>
</body>
</html>
