<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Mutual - My account</title>
<link rel="stylesheet" href="/fillerai-chat.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <span class="logo">Northwind <b>Mutual</b></span>
    <nav>
      <a href="#details">My details</a>
      <a href="#address">Address</a>
      <a href="#documents">Documents</a>
      <a href="#history">Requests</a>
    </nav>
    <span class="who" id="who"></span>
  </div>
</header>

<main class="wrap">
  <p class="sample-note">A sample application. Everything on this page is its own; only the
    chat window in the corner talks to FillerAI, through this application's server.</p>

  <div class="layout">
    <section class="card" id="details">
      <h2>My details</h2>
      <dl class="onfile" id="onfile"></dl>
    </section>

    <section class="card" id="history">
      <h2>Recent requests</h2>
      <table class="requests">
        <thead><tr><th>Reference</th><th>Request</th><th>When</th></tr></thead>
        <tbody id="requests"></tbody>
      </table>
    </section>

    <section class="card form-card" id="address" data-template="address_change">
      <h2>Update your address</h2>
      <div class="banner" hidden></div>
      <form data-path="/api/address" autocomplete="off">
        <div class="grid">
          <label class="wide">Street address *<input name="street_address" required></label>
          <label>Apartment / unit<input name="unit"></label>
          <label>City *<input name="city" required></label>
          <label>State *<input name="state" required maxlength="2"></label>
          <label>ZIP code *<input name="postal_code" required></label>
          <label>Country<select name="country"><option>US</option><option>CA</option><option>MX</option></select></label>
        </div>
        <div class="form-foot">
          <button type="reset" class="quiet">Put back what is on file</button>
          <button type="submit">Save address</button>
        </div>
      </form>
    </section>

    <section class="card form-card" id="documents" data-template="document_request">
      <h2>Request a document</h2>
      <div class="banner" hidden></div>
      <form data-path="/api/documents" autocomplete="off">
        <div class="grid">
          <label>Policy number *<input name="policy_number" required></label>
          <label>Document *<select name="document_type" required>
            <option value=""></option>
            <option>Declarations page</option><option>ID card</option>
            <option>Proof of insurance</option><option>Full policy</option>
            <option>Billing statement</option></select></label>
          <label class="wide">Name on the policy<input name="full_name"></label>
        </div>
        <div class="form-foot">
          <button type="reset" class="quiet">Clear</button>
          <button type="submit">Send it to me</button>
        </div>
      </form>
    </section>
  </div>
</main>

<button class="launcher" id="launcher" aria-expanded="false" aria-controls="dock">Chat with us</button>
<div class="dock" id="dock" hidden>
  <div id="chat"></div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
