[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fillerai"
version = "0.11.0"
description = "Synthetic sample data, autofill and simulation for dense web forms"
readme = "README.md"
requires-python = ">=3.10"
# No runtime dependencies on purpose: this has to run inside locked-down
# environments where the real form data lives.
dependencies = []

[project.scripts]
fillerai = "fillerai.cli:main"

[tool.setuptools]
packages = [
    "fillerai",
    "fillerai.extract",
    "fillerai.generate",
    "fillerai.llm",
    "fillerai.simulate",
    "fillerai.train",
    "fillerai.train.algos",
    "fillerai.web",
]

[tool.setuptools.package-data]
# The UI is served from disk, so its assets have to ship with the package -
# and so does the JavaScript client, since the whole point of serving it at
# /client/fillerai.js is that an application can fetch it from the running
# service rather than vendoring a copy that drifts.
"fillerai.web" = ["static/*", "static/client/*"]
